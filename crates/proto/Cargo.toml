[package]
name = "fitcom-proto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# B1: de controlesom van een uitnodigingscode. Zat al in de lockfile (bestandshashes in `app`).
blake3 = "1.8.5"
# B1: een uitnodigingscode is base32, zodat hij hoofdletterongevoelig te plakken is.
data-encoding = "2.11.0"
rmp-serde = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
thiserror = "2.0.19"
uuid = { version = "1.24.0", features = ["v4", "serde"] }
