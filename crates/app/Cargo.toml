[package]
name = "fitcom"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The exe carries its icon, which tauri-build used to embed (the manifest comes from GPUI's
# `windows-manifest` feature, see `build.rs`). Host-gated like every build-dependency; `build.rs`
# only calls it when the *target* is Windows.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.5"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.4", features = ["derive"] }
directories = "6.0.0"
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
fitcom-audio.workspace = true
fitcom-net.workspace = true
fitcom-proto.workspace = true
fitcom-store.workspace = true
fitcom-video.workspace = true
# Tray icon on both platforms: a Win32 thread of its own on Windows (`tray.rs`), the main
# thread on macOS (`ui/mod.rs::mac_tray`). The module docs of `tray.rs` say why they differ.
tray-icon = "0.24.2"
# GPUI plus its component library and default icon set. The default features are exactly
# those two layers; tree-sitter, webview and speech stay off.
gpui-kit = "0.7"
rfd = "0.17.2"
# Alleen voor het ophalen van de release-feed (`release.rs`). Rustls, zodat er geen
# tweede TLS-stack naast die van quinn komt; `ring` is dezelfde crypto-backend.
ring = "0.17.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync", "time", "macros", "fs", "io-util"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
ureq = { version = "3.3.0", default-features = false, features = ["rustls", "json"] }

[dev-dependencies]
# GPUI's headless test window, for the one test of the pane model in `ui/view/mod.rs`.
gpui-kit = { version = "0.7", features = ["test-support"] }

[target.'cfg(windows)'.dependencies]
# The window handle the Win32 tray thread shows and hides (`tray::onthoud_venster`).
raw-window-handle = "0.6.2"
tauri-winrt-notification = "0.8.1"
# `Win32_Media_Audio` is voor `PlaySound` uit `geluid.rs`, `Win32_UI_Shell` voor
# `ShellExecuteW` uit `ui/commands.rs`, `Media_Control` (met `Foundation*`) voor wat Spotify
# speelt in `muziek.rs`; de rest stond er al.
windows = { version = "0.62.2", features = ["Foundation", "Foundation_Collections", "Media_Control", "Win32_Foundation", "Win32_Media", "Win32_Media_Audio", "Win32_System_Diagnostics_Debug", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
