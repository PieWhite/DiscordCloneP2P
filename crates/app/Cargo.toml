[package]
name = "fitcom"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.5"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.4", features = ["derive"] }
directories = "6.0.0"
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
fitcom-audio.workspace = true
fitcom-net.workspace = true
fitcom-proto.workspace = true
fitcom-store.workspace = true
fitcom-video.workspace = true
rfd = "0.17.2"
# Alleen voor het ophalen van de release-feed (`release.rs`). Rustls, zodat er geen
# tweede TLS-stack naast die van quinn komt; `ring` is dezelfde crypto-backend.
ring = "0.17.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "2.11.5", features = ["protocol-asset"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync", "time", "macros", "fs", "io-util"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
ureq = { version = "3.3.0", default-features = false, features = ["rustls", "json"] }

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8.1"
tray-icon = "0.24.2"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Media", "Win32_System_Diagnostics_Debug", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

# De mac-tray loopt via Tauri's eigen tray-API (main-thread); zie `ui/mod.rs::mac_tray`
# en het modulecommentaar van `tray.rs` voor waarom Windows dat anders doet.
[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2.11.5", features = ["protocol-asset", "tray-icon"] }
