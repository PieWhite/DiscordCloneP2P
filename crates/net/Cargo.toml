[package]
name = "fitcom-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
fitcom-proto.workspace = true
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
# ring i.p.v. aws-lc-rs: die laatste vereist cmake + nasm om te bouwen op Windows.
# Moet overeenkomen met quinn's "rustls-ring" feature, anders krijg je twee
# crypto-providers en een panic op "no process-level CryptoProvider available".
rcgen = { version = "0.14.7", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23.42", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# Alleen voor SO_RCVBUF op de mediasocket; std kan dat niet. Zat hier al in via quinn.
socket2 = "0.6.5"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util"] }
tracing = "0.1.44"

# `Win32_Media` voor timeBeginPeriod: zonder dat duurt elke leestimeout op de mediasocket
# 15,6 ms in plaats van wat er gevraagd wordt. Zie `media::zorg_voor_fijne_timer`.
# `Win32_Foundation` voor SetHandleInformation; zie `media::niet_doorgeven_aan_kindproces`.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Media"] }

[dev-dependencies]
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
